name: CI

on:
  pull_request:
  push:
    branches: [main]

# A contributor who pushes five times in a row should not queue five full runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Turbo runs these across every workspace and caches per package, so a PR
      # that only touches one app does not rebuild the other three.
      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Test
        run: npx turbo run test
        env:
          # mongodb-memory-server downloads a real mongod on first run.
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries

      - name: Build
        run: npx turbo run build
